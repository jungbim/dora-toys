<head>

<title>도라의 장난감</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#ffe9f0;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#6b3d55;overflow:hidden;touch-action:none;user-select:none}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
#hud{display:flex;gap:18px;font-weight:700;font-size:18px}
#box{position:relative}
canvas{display:block;background:radial-gradient(circle at 50% 45%,#fffcf2,#fdf0d5);border-radius:14px;box-shadow:0 0 0 3px #c45f82,0 6px 0 #d9668b,0 10px 18px rgba(107,61,85,.18)}
#msg{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#fff;padding:6px 12px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;box-shadow:0 2px 0 #f3b6c9}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,233,240,.92);border-radius:14px;text-align:center;padding:16px}
.ov h1{font-size:30px}.ov p{font-size:15px;line-height:1.5}
button{font:inherit;font-size:20px;font-weight:700;padding:10px 26px;border:0;border-radius:99px;background:#ff8fb1;color:#fff;box-shadow:0 4px 0 #d9668b;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #d9668b}
#muteBtn{font-size:14px;padding:6px 14px;box-shadow:0 3px 0 #d9668b;background:#ffb3c9}
#muteBtn.muted{background:#c9a0b0;box-shadow:0 3px 0 #a07a8a}
.hide{display:none}
</style>
</head>

/* Audio: procedural Web Audio (BGM + toy pickup + vacuum). Unlocks on first user gesture. */
const DoraAudio=(()=>{
  let ctx=null,master=null,bgmG=null,sfxG=null,vacG=null;
  let muted=false,playing=false,bgmTimer=null,vacNodes=null;
  try{muted=localStorage.getItem('doraMute')==='1'}catch(e){}
  const mel=[0,2,4,7,4,2,0,7,4,5,7,9,7,5,4,2]; // cute pentatonic-ish steps from C5
  let melI=0;
  function ensure(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return false;
      ctx=new AC();
      master=ctx.createGain();master.gain.value=muted?0:1;master.connect(ctx.destination);
      bgmG=ctx.createGain();bgmG.gain.value=0.12;bgmG.connect(master);
      sfxG=ctx.createGain();sfxG.gain.value=0.42;sfxG.connect(master);
      vacG=ctx.createGain();vacG.gain.value=0;vacG.connect(master);
    }
    if(ctx.state==='suspended')ctx.resume();
    return true;
  }
  function tone(freq,t0,dur,type,gainNode,vol,slideTo){
    if(!ctx)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t0);
    if(slideTo)o.frequency.linearRampToValueAtTime(slideTo,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(gainNode);
    o.start(t0);o.stop(t0+dur+0.02);
  }
  function tickBgm(){
    if(!ctx||!playing||muted)return;
    const t=ctx.currentTime;
    const step=mel[melI%mel.length];melI++;
    const f=523.25*Math.pow(2,step/12); // C5 base
    tone(f,t,0.22,'triangle',bgmG,0.22);
    // soft fifth harmony, quieter
    tone(f*1.5,t,0.2,'sine',bgmG,0.08);
    // occasional soft bass
    if(melI%4===0)tone(f/2,t,0.28,'sine',bgmG,0.1);
  }
  function startBgm(){
    stopBgm();
    if(!ensure())return;
    melI=0;
    tickBgm();
    bgmTimer=setInterval(tickBgm,320);
  }
  function stopBgm(){
    if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}
  }
  function startVac(){
    if(!ensure()||vacNodes)return;
    // soft filtered noise whir + gentle hum
    const bufLen=2*ctx.sampleRate|0;
    const buf=ctx.createBuffer(1,bufLen,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<bufLen;i++)d[i]=(Math.random()*2-1)*0.6;
    const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=280;bp.Q.value=0.7;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
    const hum=ctx.createOscillator();hum.type='sawtooth';hum.frequency.value=58;
    const humG=ctx.createGain();humG.gain.value=0.035;
    const humF=ctx.createBiquadFilter();humF.type='lowpass';humF.frequency.value=180;
    src.connect(bp);bp.connect(lp);lp.connect(vacG);
    hum.connect(humF);humF.connect(humG);humG.connect(vacG);
    const now=ctx.currentTime;
    vacG.gain.cancelScheduledValues(now);
    vacG.gain.setValueAtTime(vacG.gain.value,now);
    vacG.gain.linearRampToValueAtTime(muted?0:0.07,now+0.4);
    src.start();hum.start();
    vacNodes={src,hum};
  }
  function stopVac(){
    if(!ctx)return;
    const now=ctx.currentTime;
    vacG.gain.cancelScheduledValues(now);
    vacG.gain.setValueAtTime(vacG.gain.value,now);
    vacG.gain.linearRampToValueAtTime(0,now+0.25);
    const nodes=vacNodes;vacNodes=null;
    if(nodes){
      setTimeout(()=>{try{nodes.src.stop();nodes.hum.stop()}catch(e){}},300);
    }
  }
  function pickup(){
    if(!ensure()||muted||!playing)return;
    const t=ctx.currentTime;
    // cheerful ascending blip
    tone(880,t,0.08,'square',sfxG,0.28,1175);
    tone(1175,t+0.07,0.1,'triangle',sfxG,0.22,1568);
    tone(1568,t+0.14,0.12,'sine',sfxG,0.18);
  }
  function meow(){
    if(!ensure()||muted||!playing)return;
    const t=ctx.currentTime;
    // soft cat meow: pitch up then down
    tone(620,t,0.18,'triangle',sfxG,0.32,920);
    tone(920,t+0.14,0.28,'sine',sfxG,0.28,480);
    tone(480,t+0.36,0.12,'triangle',sfxG,0.12,360);
  }
  function onStart(){
    if(!ensure())return;
    playing=true;
    startBgm();
    startVac();
  }
  function onOver(){
    playing=false;
    stopVac();
    stopBgm();
  }
  function setMuted(m){
    muted=!!m;
    try{localStorage.setItem('doraMute',muted?'1':'0')}catch(e){}
    if(master){
      const now=ctx?ctx.currentTime:0;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value,now);
      master.gain.linearRampToValueAtTime(muted?0:1,now+0.08);
    }
    // keep vacuum gain target consistent when unmuting mid-play
    if(vacG&&ctx&&playing&&!muted&&vacNodes){
      const now=ctx.currentTime;
      vacG.gain.cancelScheduledValues(now);
      vacG.gain.linearRampToValueAtTime(0.07,now+0.15);
    }
    syncBtn();
  }
  function toggleMute(){
    ensure();
    setMuted(!muted);
  }
  function syncBtn(){
    const b=$('muteBtn');if(!b)return;
    b.textContent=muted?'소리':'음소거';
    b.classList.toggle('muted',muted);
    b.setAttribute('aria-pressed',muted?'true':'false');
  }
  function isMuted(){return muted}
  return{onStart,onOver,pickup,meow,toggleMute,syncBtn,isMuted,ensure};
})();

const rnd=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d};

function pathLen(){let L=0,p=head;for(const q of path){L+=dist(p,q);p=q}return L}
// make sure the recorded path is long enough for all tail toys
function ensurePath(){
  const need=(toys.length+2)*SP;let L=pathLen(),guard=0;
  while(L<need&&guard++<3000){
    const a=path[path.length-1],b=path.length>1?path[path.length-2]:head;
    let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
    if(d<1e-6){dx=-Math.cos(head.a);dy=-Math.sin(head.a);d=1}
    const n={x:clamp(a.x+dx/d*REC,HR,W-HR),y:clamp(a.y+dy/d*REC,HR,W-HR)};
    L+=dist(a,n);path.push(n);
  }
}
// sample tail positions at fixed spacing along the path; trim unused path
function updateSegs(){
  segs=[];let p=head,i=0,acc=0,target=SP;
  for(let k=0;k<toys.length;k++){
    target=GAP+k*SP;
    while(i<path.length){
      const q=path[i],d=dist(p,q);
      if(acc+d>=target){const t=(target-acc)/(d||1);segs.push({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t});break}
      acc+=d;p=q;i++;
    }
    if(i>=path.length)segs.push({x:p.x,y:p.y});
  }
  if(path.length>i+8)path.length=i+8;
}
function freeSpot(){
  let s,t=0;
  do{s={x:rnd(40,W-40),y:rnd(40,W-40)};t++}
  while(t<300&&(dist(s,head)<70||dist(s,pul)<50||segs.some(g=>dist(g,s)<TR*2.5)));
  return s;
}
function newFood(){food=freeSpot();food.e=TOYS[Math.random()*TOYS.length|0]}
function start(){
  head={x:150,y:300,a:0};path=[];
  for(let x=150-REC;x>=HR;x-=REC)path.push({x,y:300});
  toys=[];segs=[];drops=[];
  pul={x:450,y:150,a:rnd(0,Math.PI*2),av:0};pulCd=0;
  ensurePath();updateSegs();newFood();
  state='play';last=performance.now();keyL=keyR=false;steer=null;ptrDown=false;mouseSteer=false;
  $('title').classList.add('hide');$('over').classList.add('hide');updHud();
  DoraAudio.onStart();
}
function addToys(n){
  if(!toys)start();
  n=Math.max(0,n|0);
  for(let k=0;k<n;k++)toys.push(TOYS[Math.random()*TOYS.length|0]);
  ensurePath();updateSegs();updHud();
}
function updHud(){$('sc').textContent=toys?toys.length:0;$('bs').textContent=best}
function say(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(msgT);msgT=setTimeout(()=>m.style.opacity=0,1400)}
function over(){
  state='over';DoraAudio.onOver();
  if(toys.length>best){best=toys.length;try{localStorage.setItem('doraBest',best)}catch(e){}}
  $('fs').textContent=toys.length;$('fb').textContent=best;updHud();$('over').classList.remove('hide');
}
const BASE_SP=130;function speed(){return Math.min(210,BASE_SP+toys.length*2.5)};function pulSpeed(){return BASE_SP*1.5}
function stepHead(dt){
  let turn=0;
  if(keyL)turn-=1;if(keyR)turn+=1;
  if(!turn&&steer&&(ptrDown||mouseSteer)){
    const dx=steer.x-head.x,dy=steer.y-head.y;
    if(Math.hypot(dx,dy)>HR*0.8){
      const d=angDiff(head.a,Math.atan2(dy,dx));
      turn=clamp(d/(TURN*dt),-1,1);
    }
  }
  head.a+=turn*TURN*dt;
  const v=speed();
  head.x+=Math.cos(head.a)*v*dt;head.y+=Math.sin(head.a)*v*dt;
  bounceWalls();
  if(dist(head,path[0]||head)>=REC)path.unshift({x:head.x,y:head.y});
}
function bounceWalls(){
  const u=HEAD_DRAW/256,left=DAX*u,right=(DU-DAX)*u,top=DAY*u,bot=(DU-DAY)*u;
  const minX=WALL+left,maxX=W-WALL-right,minY=WALL+top,maxY=W-WALL-bot;
  if(head.x<minX){head.x=minX;if(Math.cos(head.a)<0)head.a=Math.PI-head.a}
  else if(head.x>maxX){head.x=maxX;if(Math.cos(head.a)>0)head.a=Math.PI-head.a}
  if(head.y<minY){head.y=minY;if(Math.sin(head.a)<0)head.a=-head.a}
  else if(head.y>maxY){head.y=maxY;if(Math.sin(head.a)>0)head.a=-head.a}
}
function stepPul(dt){
  pul.av=clamp(pul.av+rnd(-1,1)*8*dt,-1.6,1.6);
  const m=70;
  if(pul.x<m||pul.y<m||pul.x>W-m||pul.y>W-m){
    const d=angDiff(pul.a,Math.atan2(W/2-pul.y,W/2-pul.x));
    pul.av=clamp(pul.av+Math.sign(d)*6*dt,-2.2,2.2);
  }
  pul.a+=pul.av*dt;
  pul.x=clamp(pul.x+Math.cos(pul.a)*pulSpeed()*dt,PR,W-PR);
  pul.y=clamp(pul.y+Math.sin(pul.a)*pulSpeed()*dt,PR,W-PR);
}
function collide(now){
  // Doroshi sprite AABB: walls + toy pickup (character touch)
  const u=HEAD_DRAW/256,L=head.x-DAX*u,R=head.x+(DU-DAX)*u,T=head.y-DAY*u,B=head.y+(DU-DAY)*u;
  for(let k=SKIP;k<segs.length;k++)if(dist(head,segs[k])<HR+TT-8)return over();
  {const cx=clamp(food.x,L,R),cy=clamp(food.y,T,B);
   if(Math.hypot(food.x-cx,food.y-cy)<TR){toys.push(food.e);ensurePath();updateSegs();newFood();updHud();DoraAudio.pickup()}}
  if(now>=pulCd&&toys.length&&segs.some(g=>dist(g,pul)<PR+TT-4)){
    const t=toys.pop(),g=segs.pop();pulCd=now+3000;updHud();
    drops.push({x:g.x,y:g.y,e:t,vx:rnd(-80,80),vy:-140,life:1});
    say(MSGS[Math.random()*MSGS.length|0]+' '+TOY_EMO[t]);
    DoraAudio.meow();
  }
}
function update(dt,now){
  let rest=dt;
  while(rest>0&&state==='play'){
    const h=Math.min(rest,1/120);rest-=h;
    stepHead(h);stepPul(h);updateSegs();collide(now);
  }
}
const EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function emo(e,x,y,s){if(typeof e==='number'){if(toyOk){const c=s*128/110,q=toyImg.height;ctx.drawImage(toyImg,e*q,0,q,q,x-c/2,y-c/2,c,c);return}e=TOY_EMO[e]}ctx.font=s+'px '+EF;ctx.fillText(e,x,y+s*.06)}
function drawWalls(){
  // thick frame + soft inner shadow so walls read clearly
  ctx.save();
  ctx.lineJoin='round';
  // soft drop shadow just inside the frame
  ctx.strokeStyle='rgba(107,61,85,.22)';
  ctx.lineWidth=WALL*1.6;
  ctx.strokeRect(WALL,WALL,W-2*WALL,W-2*WALL);
  // main thick wall
  ctx.strokeStyle='#e88aa8';
  ctx.lineWidth=WALL;
  ctx.strokeRect(WALL/2,WALL/2,W-WALL,W-WALL);
  // dark outer rim
  ctx.strokeStyle='#c45f82';
  ctx.lineWidth=5;
  ctx.strokeRect(2.5,2.5,W-5,W-5);
  // light inner edge
  ctx.strokeStyle='rgba(255,255,255,.65)';
  ctx.lineWidth=3;
  ctx.strokeRect(WALL+1.5,WALL+1.5,W-2*WALL-3,W-2*WALL-3);
  ctx.restore();
}
function draw(){
  const dpr=devicePixelRatio||1,k=px/W*dpr;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(k,0,0,k,0,0);
  if(!head)return;
  ctx.textAlign='center';ctx.textBaseline='middle';
  const now=performance.now();
  drawWalls();
  emo(food.e,food.x,food.y+Math.sin(now/300)*2,26);
  for(let i=segs.length-1;i>=0;i--){
    const g=segs[i];ctx.fillStyle='#ffd3e1';ctx.beginPath();ctx.arc(g.x,g.y,TT,0,7);ctx.fill();
    emo(toys[i],g.x,g.y,26);
  }
  for(const d of drops){ctx.globalAlpha=Math.max(0,d.life);emo(d.e,d.x,d.y,20)}
  ctx.globalAlpha=1;
  if(now<pulCd&&(now/150|0)%2)ctx.globalAlpha=.4;
  if(pulOk){
    if(Number.isFinite(pul.a))pulF=dirFrame(pul.a);
    else if(Number.isFinite(pul.vx)&&Math.hypot(pul.vx,pul.vy)>1e-3)pulF=dirFrame(Math.atan2(pul.vy,pul.vx));
    {const u=PUL_DRAW/256;ctx.drawImage(pulImg,pulF*PSPR,0,PSPR,PSPR,pul.x-PAX*u,pul.y-PAY*u,PU*u,PU*u);}
  }else emo('🐈',pul.x,pul.y,PR*2);
  ctx.globalAlpha=1;
  if(doroshiOk){
    // heading 0=east, +=clockwise (y down); N(up)=frame 0, each frame +45°
    const f=dirFrame(head.a);
    {const u=HEAD_DRAW/256;ctx.drawImage(doroshi,f*DSPR,0,DSPR,DSPR,head.x-DAX*u,head.y-DAY*u,DU*u,DU*u);}
  }else{
    ctx.fillStyle='#ffb3c9';ctx.beginPath();ctx.arc(head.x,head.y,HR,0,7);ctx.fill();
    // little nose dot showing heading
    ctx.fillStyle='#ff7fa6';ctx.beginPath();ctx.arc(head.x+Math.cos(head.a)*(HR+3),head.y+Math.sin(head.a)*(HR+3),3,0,7);ctx.fill();
    emo('🐱',head.x,head.y,HR*1.8);
  }
}
function loop(now){
  const dt=Math.min(Math.max(0,now-last),100)/1000;last=now;
  if(state==='play')update(dt,now);
  for(const d of drops){d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=400*dt;d.life-=dt*1.2}
  drops=drops.filter(d=>d.life>0);
  draw();requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==='ArrowLeft'||k==='a'){e.preventDefault();keyL=true;mouseSteer=false}
  else if(k==='ArrowRight'||k==='d'){e.preventDefault();keyR=true;mouseSteer=false}
  else if((k==='Enter'||k===' ')&&state!=='play'){e.preventDefault();start()}
});
addEventListener('keyup',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==='ArrowLeft'||k==='a')keyL=false;
  else if(k==='ArrowRight'||k==='d')keyR=false;
});
addEventListener('blur',()=>{keyL=keyR=false;ptrDown=false});
function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*W}}
addEventListener('pointerdown',e=>{if(state!=='play')return;ptrDown=true;steer=toWorld(e);if(e.pointerType==='mouse')mouseSteer=true});
addEventListener('pointermove',e=>{
  if(state!=='play')return;
  if(ptrDown){steer=toWorld(e)}
  else if(e.pointerType==='mouse'){steer=toWorld(e);mouseSteer=true}
});
const up=e=>{ptrDown=false;if(e.pointerType!=='mouse')steer=null};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('touchmove',e=>{if(state==='play')e.preventDefault()},{passive:false});
$('startBtn').onclick=$('againBtn').onclick=start;
$('title').onclick=e=>{if(e.target===e.currentTarget)start()};
$('over').onclick=e=>{if(e.target===e.currentTarget)start()};
$('muteBtn').onclick=e=>{e.stopPropagation();DoraAudio.toggleMute()};
DoraAudio.syncBtn();
// unlock AudioContext on any early gesture (autoplay policy)
const unlock=()=>{DoraAudio.ensure();removeEventListener('pointerdown',unlock);removeEventListener('keydown',unlock)};
addEventListener('pointerdown',unlock,{once:true});addEventListener('keydown',unlock,{once:true});
window.__dora={start,addToys,get pul(){return pul},audio:DoraAudio};
addEventListener('resize',resize);resize();requestAnimationFrame(loop);
})();
</script>
